[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Next.js App Router (SSR, API routes, edge functions in app/)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Optional: run `netlify dev` locally to mimic production
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false
